<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>raigeki.dev</title>
  <defs>
    <!-- storm light from above, same gradient the hero canvas paints -->
    <radialGradient id="sky" cx="50%" cy="-10%" r="95%">
      <stop offset="0%" stop-color="#21528f"/>
      <stop offset="55%" stop-color="#101526"/>
      <stop offset="100%" stop-color="#09090d"/>
    </radialGradient>
    <!-- the flash where the bolt lands -->
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dceaff" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#a6c8ff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#a6c8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-30%" width="260%" height="170%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#sky)"/>

  <!-- impact flare at the strike point -->
  <ellipse cx="31" cy="57" rx="18" ry="5.5" fill="url(#impact)"/>

  <!-- bolt: a jagged stroke like the one the hero canvas draws, not a glyph -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37 3 L30.5 13 L35 19 L26.5 30 L33.5 36 L27 45 L32.5 51 L31 57"
          stroke="#5c9eff" stroke-width="8.5" opacity=".8" filter="url(#glow)"/>
    <path d="M37 3 L30.5 13 L35 19 L26.5 30 L33.5 36 L27 45 L32.5 51 L31 57"
          stroke="#a6c8ff" stroke-width="4.6" opacity=".95" filter="url(#glow)"/>
    <path d="M37 3 L30.5 13 L35 19 L26.5 30 L33.5 36 L27 45 L32.5 51 L31 57"
          stroke="#f4f8ff" stroke-width="3.4"/>
    <path d="M33.5 36 L40 43" stroke="#f4f8ff" stroke-width="2.1" opacity=".85"/>
  </g>
</svg>
