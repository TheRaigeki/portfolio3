<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>raigeki.dev</title>
  <defs>
    <!-- storm light from above, same gradient the hero canvas paints -->
    <radialGradient id="sky" cx="50%" cy="-10%" r="95%">
      <stop offset="0%" stop-color="#21528f"/>
      <stop offset="55%" stop-color="#101526"/>
      <stop offset="100%" stop-color="#09090d"/>
    </radialGradient>
    <!-- the flash where the bolt lands -->
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dceaff" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#a6c8ff" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#a6c8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#sky)"/>

  <!-- impact flare, where the main channel lands -->
  <ellipse cx="27" cy="57" rx="17" ry="5" fill="url(#impact)"/>

  <!-- Main channel: long runs with sharp kinks, entering off-centre from the
       right. Branches fork at the kinks and taper away, as real strikes do. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#5c9eff" opacity=".75" filter="url(#glow)">
      <path d="M45 1 L38 17 L43 22 L31 36 L35 41 L26 57" stroke-width="8"/>
      <path d="M38 17 L31.5 26 L28 31.5" stroke-width="3.2"/>
      <path d="M35 41 L41.5 49" stroke-width="2.6"/>
    </g>
    <g stroke="#f4f8ff">
      <path d="M45 1 L38 17 L43 22 L31 36 L35 41 L26 57" stroke-width="3.1"/>
      <path d="M38 17 L31.5 26 L28 31.5" stroke-width="1.15" opacity=".78"/>
      <path d="M35 41 L41.5 49" stroke-width=".95" opacity=".62"/>
    </g>
  </g>
</svg>
